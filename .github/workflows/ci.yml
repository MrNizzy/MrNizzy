name: CI

# The README cards job pushes with GITHUB_TOKEN, which never triggers workflows,
# so its card-only commits do not run CI.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs so a moved tag cannot change what runs.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from the packageManager field in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec ng lint

      - name: Build
        run: pnpm exec ng build

      # Vitest runs the specs in headless Chrome through Playwright. The runner image
      # already ships Google Chrome, so no Playwright browser download is needed.
      - name: Unit tests
        run: pnpm exec ng test --watch=false
        env:
          CHROME_BIN: /usr/bin/google-chrome
