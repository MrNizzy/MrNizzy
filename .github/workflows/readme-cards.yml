name: README cards

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/readme-cards.mjs
      - .github/workflows/readme-cards.yml

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh stats cards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Generate cards
        run: node .github/scripts/readme-cards.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain -- .github/readme)" ]; then
            echo "Cards are up to date, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/readme/stats-dark.svg \
            .github/readme/stats-light.svg \
            .github/readme/langs-dark.svg \
            .github/readme/langs-light.svg
          # [skip ci] keeps Cloudflare Pages from rebuilding the site for card-only commits.
          git commit -m "chore(readme): refresh stats cards [skip ci]"
          git push
