<section
  aria-labelledby="hero-title"
  class="grid items-center gap-10 py-8 lg:min-h-[calc(100dvh-16rem)] lg:grid-cols-[1fr_20rem] lg:gap-16"
>
  <div class="grid gap-6">
    <h1 id="hero-title" class="font-display text-display text-fg text-balance">
      <span class="text-accent">System's Engineer</span>
      and passionate developer
    </h1>

    <p class="max-w-prose text-lg text-pretty text-fg-muted md:text-xl">
      Crafting seamless digital experiences with a blend of creativity and
      technical expertise.
    </p>

    <div class="flex flex-wrap gap-3 pt-2">
      <a appUiButton routerLink="/projects">View projects</a>
      <a appUiButton variant="secondary" routerLink="/contact">Contact me</a>
    </div>
  </div>

  <a
    href="https://github.com/MrNizzy"
    target="_blank"
    rel="noopener noreferrer"
    class="order-first w-28 rounded-full outline-hidden focus-visible:ring-2 focus-visible:ring-focus focus-visible:ring-offset-2 focus-visible:ring-offset-canvas sm:w-36 lg:order-none lg:w-full lg:justify-self-end"
  >
    <picture>
      <source srcset="mrnizzy.webp" type="image/webp" />
      <img
        src="mrnizzy.png"
        alt="MrNizzy"
        width="256"
        height="256"
        class="w-full"
        decoding="async"
      />
    </picture>
    <span class="sr-only">on GitHub (opens in a new tab)</span>
  </a>
</section>
