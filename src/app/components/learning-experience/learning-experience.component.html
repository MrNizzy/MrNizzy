<section class="grid gap-6 md:gap-8">
  <app-ui-section-heading>Fun facts</app-ui-section-heading>

  <ul class="grid gap-4 md:grid-cols-2 md:gap-6">
    @for (item of learningExperiences(); track $index) {
      <li appUiCard variant="glass" padding="sm" class="flex items-center gap-4">
        <img
          [src]="item.icon"
          alt=""
          width="48"
          height="48"
          loading="lazy"
          decoding="async"
          class="size-12 shrink-0 object-contain"
        />
        <p class="text-fg-muted">
          {{ item.text }}
          @if (item.link; as link) {
            <a appUiLink external class="whitespace-nowrap" [href]="link.url"
              >{{ link.text
              }}<app-ui-icon
                name="external-link"
                [size]="16"
                class="ml-1 align-middle"
              /><span class="sr-only"> (opens in a new tab)</span></a
            >
          }
        </p>
      </li>
    }
  </ul>
</section>
