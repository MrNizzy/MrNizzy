<header
  class="fixed inset-x-0 top-0 z-50 border-b border-line bg-canvas/80 backdrop-blur-md"
>
  <div
    class="mx-auto flex h-18 w-full max-w-5xl items-center justify-between px-4 sm:px-6"
  >
    <a routerLink="/" [class]="brandClasses">
      <picture>
        <source srcset="mrnizzy.webp" type="image/webp" />
        <img src="mrnizzy.png" alt="" width="42" height="42" />
      </picture>
      <span class="font-display text-3xl font-extrabold tracking-tight text-fg">
        MrNizzy
      </span>
    </a>

    <div class="flex items-center gap-1 lg:gap-2">
      <nav aria-label="Main" class="hidden md:block">
        <ul class="flex items-center gap-2 lg:gap-4">
          @for (link of links; track link.path) {
          <li>
            <a
              [routerLink]="link.path"
              routerLinkActive
              ariaCurrentWhenActive="page"
              [routerLinkActiveOptions]="exactMatch"
              [class]="desktopLinkClasses"
            >
              {{ link.label }}
            </a>
          </li>
          }
        </ul>
      </nav>

      <app-theme-toggle class="hidden md:flex" />

      <button
        #burger
        type="button"
        cdkOverlayOrigin
        #menuOrigin="cdkOverlayOrigin"
        class="md:hidden"
        [class]="iconButtonClasses"
        [attr.aria-label]="isExpanded() ? 'Close menu' : 'Open menu'"
        [attr.aria-expanded]="isExpanded()"
        aria-controls="mobile-menu"
        (click)="toggle()"
      >
        <app-ui-icon [name]="isExpanded() ? 'close' : 'menu'" [size]="24" />
      </button>
    </div>
  </div>
</header>

<!-- Mobile full-screen menu -->
<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="menuOrigin"
  [cdkConnectedOverlayOpen]="isMenuOpen()"
  [cdkConnectedOverlayHasBackdrop]="true"
  [cdkConnectedOverlayDisableClose]="true"
  (backdropClick)="close()"
  (overlayKeydown)="onOverlayKeydown($event)"
>
  <div
    id="mobile-menu"
    role="dialog"
    aria-modal="true"
    aria-label="Menu"
    cdkTrapFocus
    cdkTrapFocusAutoCapture
    class="fixed inset-0"
  >
    <!-- Backplate -->
    <div
      class="absolute inset-0 bg-canvas/95 backdrop-blur-md"
      [class.overlay-fade-out]="isClosing()"
      [class.overlay-fade-in]="!isClosing()"
      aria-hidden="true"
    ></div>

    <!-- Menu panel -->
    <div
      class="relative flex h-full flex-col items-center justify-center px-4"
      [class.overlay-panel-out]="isClosing()"
      [class.overlay-panel-in]="!isClosing()"
    >
      <nav aria-label="Main">
        <ul class="grid gap-4 text-center">
          @for (link of links; track link.path) {
          <li>
            <a
              [routerLink]="link.path"
              routerLinkActive
              ariaCurrentWhenActive="page"
              [routerLinkActiveOptions]="exactMatch"
              [class]="mobileLinkClasses"
              (click)="close()"
            >
              {{ link.label }}
            </a>
          </li>
          }
        </ul>
      </nav>

      <app-theme-toggle class="mt-8 flex" />

      <button
        type="button"
        class="absolute right-4 top-3.5 sm:right-6"
        [class]="iconButtonClasses"
        aria-label="Close menu"
        (click)="close()"
      >
        <app-ui-icon name="close" [size]="24" />
      </button>
    </div>
  </div>
</ng-template>
