<!-- Full-width glass band, same surface as the navbar, so the footer text never
     sits straight on the animated background. -->
<footer
  class="mt-16 w-full border-t border-line bg-canvas/80 backdrop-blur-md"
>
  <div
    class="mx-auto flex w-full max-w-5xl flex-col gap-4 px-4 pt-6 pb-8 text-sm text-fg-subtle sm:flex-row sm:items-start sm:justify-between sm:px-6"
  >
    <div class="grid gap-1">
      <p>
        Designed and built by
        <span class="font-medium text-fg-muted">{{ author() }}</span>
        with Angular.
      </p>
      <p>&copy; {{ currentYear() }} {{ author() }}</p>
    </div>

    <nav aria-label="Footer">
      <ul role="list" class="flex flex-wrap gap-x-6 gap-y-1">
        @for (link of links; track link.path) {
          <li>
            <a appUiLink class="inline-block py-1" [routerLink]="link.path">{{
              link.label
            }}</a>
          </li>
        }
      </ul>
    </nav>
  </div>
</footer>
