<section appUiCard variant="glass" padding="lg" class="grid gap-6 md:gap-8">
  <app-ui-section-heading
    description="Email is the fastest way to reach me. You can also find me on these platforms."
  >
    Connect
  </app-ui-section-heading>

  <ul class="flex flex-wrap gap-3">
    <li>
      <a appUiButton [href]="mailtoHref">
        <app-ui-icon name="mail" />
        Email me
      </a>
    </li>
    @for (channel of channels; track channel.name) {
      <li>
        <a
          appUiButton
          variant="secondary"
          [href]="channel.url"
          target="_blank"
          rel="noopener noreferrer"
        >
          @if (channel.registryIcon; as icon) {
            <app-ui-icon [name]="icon" />
          } @else {
            <img
              [src]="channel.icon"
              alt=""
              width="20"
              height="20"
              loading="lazy"
              decoding="async"
              class="size-5 shrink-0 object-contain"
            />
          }
          {{ channel.name }}
          <span class="sr-only">(opens in a new tab)</span>
        </a>
      </li>
    }
  </ul>
</section>
