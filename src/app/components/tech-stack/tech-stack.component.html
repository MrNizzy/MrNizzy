<section class="grid gap-6 md:gap-8">
  <app-ui-section-heading>Tech Stack & Tools</app-ui-section-heading>

  @for (group of tools(); track $index) {
    <ul
      class="grid grid-cols-[repeat(auto-fill,minmax(8rem,1fr))] gap-3 md:gap-4"
    >
      @for (tool of group; track tool.name) {
        <li class="flex">
          <a
            appUiCard
            interactive
            variant="glass"
            padding="sm"
            [href]="tool.url"
            target="_blank"
            rel="noopener noreferrer"
            class="flex w-full flex-col items-center gap-3 text-center outline-hidden"
          >
            @if (tool.monochrome) {
              <!-- White glyph: drawn as a mask so it follows the text colour in both themes. -->
              <span
                aria-hidden="true"
                class="block size-12 shrink-0 bg-fg [mask-position:center] [mask-repeat:no-repeat] [mask-size:contain]"
                [style.mask-image]="'url(' + tool.icon + ')'"
              ></span>
            } @else {
              <img
                [src]="tool.icon"
                alt=""
                width="48"
                height="48"
                loading="lazy"
                decoding="async"
                class="size-12 shrink-0 object-contain"
              />
            }
            <span class="text-sm font-medium text-balance text-fg-muted">
              {{ tool.name }}
              <span class="sr-only">(opens in a new tab)</span>
            </span>
          </a>
        </li>
      }
    </ul>
  }
</section>
