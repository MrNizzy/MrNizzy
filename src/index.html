<!DOCTYPE html>
<!--
  No static data-theme on <html>: the pre-paint script below sets it before the
  first paint. The production build inlines critical CSS and keeps only the
  rules that match this static markup (see the comment in styles.scss).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>mrnizzy</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="mrnizzy.webp" />
    <script>
      // Pre-paint theme: sets data-theme on <html> before the first paint.
      // Keep this logic and the flag in sync with ThemeService
      // (src/app/core/services/theme.service.ts).
      (function () {
        var LIGHT_THEME_ENABLED = true;
        var theme = 'dark';
        if (LIGHT_THEME_ENABLED) {
          var pref = 'system';
          try {
            var stored = localStorage.getItem('theme');
            if (stored === 'light' || stored === 'dark') pref = stored;
          } catch (e) {}
          theme =
            pref === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : pref;
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <!--
      Inert, never rendered. It exists so the [data-theme="light"] palette
      matches something in this static markup and therefore stays in the
      inlined critical CSS; without it a light first paint would flash dark.
    -->
    <template data-theme="light"></template>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Open+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="selection:bg-accent-fill selection:text-white">
    <app-root></app-root>
  </body>
</html>
